.verse-head h2{margin:0;font-size:1.25rem}

/* ============ CHOICES STORE (shared, keyed by Strong's) ============ */
const store = {
  mem: {},
  load(){ try{ this.mem = JSON.parse(localStorage.getItem("byotChoices")||"{}") || {}; }
           catch(e){ this.mem = {}; } },
  save(){ try{ localStorage.setItem("byotChoices", JSON.stringify(this.mem)); }catch(e){} },
  get(s){ return (s && this.mem[s]) || null; },
  set(s, choice){ if(choice) this.mem[s]=choice; else delete this.mem[s]; this.save(); }
};
store.load();

/* A rendering in parentheses, e.g. "(untranslated)", is not a translation. */
function isUntranslated(s){ return typeof s==="string" && /^\(.*\)$/.test(s.trim()); }

/* The rendering a word shows. Study: choice -> Young's (computed) -> gloss.
   Read: choice -> KJV -> gloss. Custom choices are the user's own text.
   Returns null when the word has no rendering to show (untranslated). */
function effective(w, ctx){
  const c = store.get(w.s);
  if(c && c.mode==="custom") return c.text ?? "";
  const mode = c ? c.mode : (ctx==="read" ? "kjv" : "youngs");
  let base = mode==="kjv" ? w.kjv : w.ylt;
  if(base==null || base==="") base = w.g || "";
  if(isUntranslated(base)) return null;
  return base;
}
function esc(s){
  return (s==null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function arr(x){ return Array.isArray(x) ? x : []; }

/* ============ API (read-only GET) ============
   The Lampy database is reached only through this JSON API. API_BASES names
   the routes in probe order: the public funnel, the tailnet address, then a
   same-host relative path (the app served from Lampy itself). All three
   reach the same API. A base that answers keeps the session (apiBaseIdx);
   a base that fails hands over to the next.
   Rules: non-JSON (incl. an HTML 404 from a static server) = unreachable;
   JSON {"error":"not found"} with 404 = not found, no fallback. Only successful
   results are memoized; after a failure, calls wait API_COOLDOWN_MS. */
const API_BASES = ["https://laptop.taila7a335.ts.net:8443/bible",
                   "https://laptop.taila7a335.ts.net/bible",
                   "/bible"];
const API_TIMEOUT_MS = 8000;
const API_COOLDOWN_MS = 30000;
const apiDownUntil = new Map();   // path -> time when it may be tried again
const apiMemo = new Map();
let apiBaseIdx = 0;               // base that last answered; session-sticky
async function apiTry(base, path){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), API_TIMEOUT_MS);
  let res, text;
  try{
    res = await fetch(base+path, {method:"GET", headers:{Accept:"application/json"}, signal:ctrl.signal});
    text = await res.text();
  }catch(e){
    return {ok:false, reason:"down"};
  }finally{ clearTimeout(timer); }
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ return {ok:false, reason:"down"}; }
  if(res.status===404 && data && data.error==="not found") return {ok:false, reason:"notfound"};
  if(!res.ok) return {ok:false, reason:"down"};
  return {ok:true, data};
}
async function apiGet(path){
  if(apiMemo.has(path)) return {ok:true, data:apiMemo.get(path)};
  if(Date.now() < (apiDownUntil.get(path) || 0)) return {ok:false, reason:"down"};
  for(let k=0; k<API_BASES.length; k++){
    const i = (apiBaseIdx + k) % API_BASES.length;
    const r = await apiTry(API_BASES[i], path);
    if(r.ok){
      apiBaseIdx = i;
      apiMemo.set(path, r.data);
      return r;
    }
    if(r.reason==="notfound") return r;   // the API's own answer; authoritative
  }
  apiDownUntil.set(path, Date.now()+API_COOLDOWN_MS);
  return {ok:false, reason:"down"};
}
/* One data call. Returns {data, sample} or {notFound} or {unavailable}.
   `fallback` returns the built-in sample value, or null when the sample has
   nothing for this request. Nothing is invented beyond the sample. */
async function fromApi(path, fallback){
  const r = await apiGet(path);
  if(r.ok) return {data:r.data, sample:false};
  if(r.reason==="notfound") return {data:null, sample:false, notFound:true};
  const s = fallback ? fallback() : null;
  if(s==null) return {data:null, sample:true, unavailable:true};
  return {data:s, sample:true};
}

/* ============ SAMPLE FALLBACK (Genesis 1:1–5 only) ============ */
const sampleBooks = () => CORPUS.books.map((name,i)=>({book_id:i+1, name_en:name}));
function sampleVerse(b, c, v){
  if(b!==1 || c!==1) return null;
  const full = CORPUS.verses.find(x=>x.n===v);
  if(full) return full;
  const ro = CORPUS.readExtra.find(x=>x.n===v);
  return ro ? {n:v, kjvText: ro.segs.map(s=>s.x).join(""), youngsText:null, notes:[], words:[], segs:ro.segs} : null;
}
function sampleWord(s){
  const hits = [];
  for(const v of CORPUS.verses) for(const w of v.words) if(w.s===s) hits.push({n:v.n, w});
  if(!hits.length) return null;
  noteRenderings(hits.map(x=>x.w));
  const f = hits[0].w;
  const occ = [...new Map(hits.map(x=>[x.n, x])).values()].map(x=>({book_id:1, chapter:1, verse:x.n, ref:`Genesis 1:${x.n}`, to:"study"}));
  for(const x of CORPUS.readExtra) for(const seg of x.segs) if(seg.s===s && !occ.some(o=>o.verse===x.n))
    occ.push({book_id:1, chapter:1, verse:x.n, ref:`Genesis 1:${x.n}`, to:"read"});
  occ.sort((a,b)=>a.verse-b.verse);
  return {s, h:f.h, t:f.t, g:f.g, gr:f.gr, occ};
}
function sampleSearch(q){
  const needle = q.toLowerCase();
  return CORPUS.searchSamples
    .filter(x=>x.text.toLowerCase().includes(needle))
    .map(x=>({ref:x.ref, text:x.text, score:x.score, source:"sample"}));
}

let bookList = [];
async function getBooks(){
  const r = await fromApi("/api/books", sampleBooks);

  return r;
}
function bookName(id){
  const b = bookList.find(x=>x.book_id===id);
  return b ? b.name_en : (CORPUS.books[id-1] || `Book ${id}`);
}
const getChapters = (b) => fromApi(`/api/chapters/${b}`, ()=> b===1 ? [1] : null);
const getVerseNums = (b,c) => fromApi(`/api/verses/${b}/${c}`, ()=> (b===1&&c===1) ? [1,2,3,4,5] : null);

/* Word-level renderings seen so far, by Strong's number. The word page draws
   its Renderings panel from these. */
const wordRenderings = new Map();
function noteRenderings(words){
  for(const w of arr(words)){
    if(!w.s) continue;
    let m = wordRenderings.get(w.s);
    if(!m){ m = {kjv:new Set(), ylt:new Set()}; wordRenderings.set(w.s, m); }
    if(w.kjv && !isUntranslated(w.kjv)) m.kjv.add(w.kjv);
    if(w.ylt && !isUntranslated(w.ylt)) m.ylt.add(w.ylt);
  }
}
function renderingsFor(s){
  const m = wordRenderings.get(s);
  return m ? {kjv:[...m.kjv], ylt:[...m.ylt]} : {kjv:[], ylt:[]};
}
/* Live verse payload -> model. words keep Strong's, KJV and computed Young's.
   sent groups the KJV sentence tokens by their Hebrew word, in English
   order — the Read page renders from it, never from the Hebrew-order chain. */
function normVerse(p, b, c, n){
  const words = arr(p.words).map(w=>({
    wid: w.wid, s: w.strongs || null, h: w.hebrew || "", t: w.xlit ?? null,
    g: w.gloss || "", gr: w.morph || "", kjv: w.kjv ?? null, ylt: w.ylt ?? null,
    supplied: !!w.supplied, variants: w.variants || null
  }));
  /* The alignment anchors ONE KJV token per Hebrew word; the word's span
     runs from its anchor to just before the next anchor. */
  const sent = [];
  for(const tok of arr(p.kjv_sentence)){
    const last = sent[sent.length-1];
    if(tok.heb_pos != null)
      sent.push({pos: tok.heb_pos, text: tok.word, supplied: !!tok.supplied});
    else if(last)
      last.text += " " + tok.word;
    else
      sent.push({pos: null, text: tok.word, supplied: !!tok.supplied});
  }
  return {live:true, book:b, ch:c, n: p.verse ?? n, words, sent,
    notes: arr(p.witnesses).map(x=>({witness:x.witness, text:x.note || x.text || ""}))};
}
async function getVerse(b, c, v){
  const r = await fromApi(`/api/verse/${b}/${c}/${v}`, ()=>sampleVerse(b, c, v));
  if(r.data && !r.sample) r.data = normVerse(r.data, b, c, v);
  if(r.data) noteRenderings(r.data.words);
  return r;
}
async function getChapter(b, c){
  const r = await fromApi(`/api/chapter/${b}/${c}`, ()=> (b===1&&c===1) ? [1,2,3,4,5].map(n=>sampleVerse(1,1,n)) : null);
  if(r.data){
    r.data = r.sample ? r.data : arr(Array.isArray(r.data) ? r.data : r.data.verses).map(p=>normVerse(p, b, c, p.verse));
    r.data.forEach(v=>noteRenderings(v.words));
  }
  return r;
}
async function getWordPage(s){
  const r = await fromApi(`/api/word/${encodeURIComponent(s)}`, ()=>sampleWord(s));
  if(r.data && !r.sample){
    const p = r.data;
    r.data = {s: p.strongs || s, h: p.hebrew || "", t: p.xlit ?? null, g: p.gloss || "", gr: p.morph || "",
      occ: arr(p.occurrences).map(o=>({book_id:o.book_id, chapter:o.chapter, verse:o.verse, ref:o.ref, to:"study"}))};
  }
  return r;
}
async function search(q){
  const r = await fromApi(`/api/search?q=${encodeURIComponent(q)}`, ()=> /light/i.test(q) ? sampleSearch(q) : null);
  if(r.data && !r.sample) r.data = Array.isArray(r.data) ? r.data : arr(r.data.results);
  return r;
}

/* Sample verses: substitute each word's phrase in the base text, in order. */
function sampleAssemble(v, kind){
  let out = kind==="yp" ? v.youngsText : v.kjvText;
  if(!out) return null;
  for(const w of v.words||[]){
    const phrase = w[kind];
    if(!phrase) continue;
    const eff = effective(w, kind==="yp" ? "study" : "read");
    const def = kind==="yp" ? w.ylt : w.kjv;
    if(eff===null || eff===def) continue;
    const i = out.indexOf(phrase);
    if(i>=0) out = out.slice(0,i)+eff+out.slice(i+phrase.length);
  }
  return out;
}
/* Live verses: word by word, supplied words italic, untranslated words skipped. */
function liveWordsHtml(v, ctx, link){
  const parts = [];
  for(const w of v.words){
    const r = effective(w, ctx);
    if(r===null) continue;
    let piece = esc(r);
    if(w.supplied) piece = `<i>${piece}</i>`;
    parts.push(link && w.s ? `<a href="#/word/${esc(w.s)}">${piece}</a>` : piece);
  }
  return parts.join(" ");
}
function studySentence(v){
  const cap = `<span class="cap">Your translation — Young's (computed) base, your choices applied</span><br>`;
  if(v.live) return cap + liveWordsHtml(v, "study", false);
  const t = sampleAssemble(v, "yp");
  return t==null ? `<span class="note">Young's base text is not available for this verse.</span>` : cap + esc(t);
}
/* Live Read: the KJV sentence in its own English order. A Hebrew word's
   phrase is one link; the reader's own choice replaces the phrase when it
   differs from the KJV default; supplied words are italic. */
function liveReadHtml(v){
  if(!v.sent || !v.sent.length) return liveWordsHtml(v, "read", true);
  const parts = [];
  for(const g of v.sent){
    if(g.pos == null){
      parts.push(g.supplied ? `<i>${esc(g.text)}</i>` : esc(g.text));
      continue;
    }
    const w = v.words[g.pos-1];
    if(!w){ parts.push(esc(g.text)); continue; }
    const eff = effective(w, "read");
    const shown = (eff === null) ? g.text : (eff === "" ? "" : (eff !== w.kjv ? eff : g.text));
    if(shown === "") continue;
    parts.push(w.s ? `<a href="#/word/${esc(w.s)}/${v.book}/${v.ch}/${v.n}/${g.pos}">${esc(shown)}</a>` : esc(shown));
  }
  return parts.join(" ");
}
function readHtml(v){
  if(v.live) return liveReadHtml(v);
  if(v.segs) return v.segs.map(seg=>{
    if(!seg.s) return esc(seg.x);
    const c = store.get(seg.s);
    const disp = (c && c.mode==="custom") ? c.text : seg.x;
    return `<a href="#/word/${seg.s}">${esc(disp)}</a>`;
  }).join("");
  if(!v.words || !v.words.length || !v.kjvText) return esc(v.kjvText||"");
  let rest = v.kjvText, html = "";
  for(let i=0; i<v.words.length; i++){
    const w = v.words[i];
    if(!w.kp) continue;
    const idx = rest.indexOf(w.kp);
    if(idx<0) continue;
    html += esc(rest.slice(0, idx));
    const eff = effective(w, "read");
    const shown = eff===null ? w.kp : eff;
    html += w.s ? `<a href="#/word/${w.s}/1/1/${v.n}/${i+1}">${esc(shown)}</a>` : esc(shown);
    rest = rest.slice(idx + w.kp.length);
  }
  return html + esc(rest);
}

/* Word-card links may carry the verse they were tapped in:
   #/word/<Strongs>/<book>/<chapter>/<verse>/<wordPos>. The context powers
   a prev/next-word strip on the card; without it the card is unchanged. */
function parseWordSlug(slug){
  const parts = String(slug).split("/");
  let s = parts[0];
  if(s==="elohim") s = "H430";
  let ctx = null;
  if(parts.length >= 5){
    const nums = parts.slice(1, 5).map(Number);
    if(nums.every(Number.isFinite)) ctx = {b: nums[0], c: nums[1], v: nums[2], pos: nums[3]};
  }
  return {s, ctx};
}
/* Nearest words with a Strong's number on either side of pos (1-based);
   Strong's-less words are skipped. */
function wordNeighbors(words, pos){
  let prev = null, next = null;
  for(let i=pos-2; i>=0; i--)
    if(words[i] && words[i].s){ prev = {s: words[i].s, pos: i+1}; break; }
  for(let i=pos; i<words.length; i++)
    if(words[i] && words[i].s){ next = {s: words[i].s, pos: i+1}; break; }
  return {prev, next};
}
function wordNavStrip(ctx, words){
  const {prev, next} = wordNeighbors(words, ctx.pos);
  const href = nb => `#/word/${esc(nb.s)}/${ctx.b}/${ctx.c}/${ctx.v}/${nb.pos}`;
  const prevHtml = prev
    ? `<a class="btn" href="${href(prev)}">‹ Prev word</a>`
    : `<span class="btn" style="opacity:.45">‹ Prev word</span>`;
  const nextHtml = next
    ? `<a class="btn" href="${href(next)}">Next word ›</a>`
    : `<span class="btn" style="opacity:.45">Next word ›</span>`;
  return `<div class="text-nav">${prevHtml}
    <span class="pos"><a href="#/interlinear" data-b="${ctx.b}" data-c="${ctx.c}" data-v="${ctx.v}" data-to="study">${esc(bookName(ctx.b))} ${ctx.c}:${ctx.v}</a> · word ${ctx.pos} of ${words.length}</span>
    ${nextHtml}</div>`;
}
async function viewWordPage(slug){
  const {s, ctx} = parseWordSlug(slug);
  const r = await getWordPage(s);
  if(r.notFound) return {sample:false, nav:"", html: errorBlock(`No word with Strong's number ${s} is in the database.`)};
  const w = r.data;
  if(!w) return {sample:true, nav:"", html: bannerFor(true) + errorBlock(
    `Word ${esc(s)} is not available: the database is unreachable, and the sample has no card for it.`)};
  const rend = renderingsFor(s);
  const pseudo = {s, kjv: rend.kjv[0] ?? null, ylt: rend.ylt[0] ?? null, g: w.g};
  const list = xs => xs.length
    ? xs.map(x=>`<span class="rchip">${esc(x)}</span>`).join("")
    : `<span class="note">Shown once a verse with this word has been opened.</span>`;
  const occ = w.occ.map(o => o.verse!=null
    ? `<li><a href="#/interlinear" data-b="${o.book_id||1}" data-c="${o.chapter||1}" data-v="${o.verse}" data-to="${o.to||"study"}">${esc(o.ref)}</a></li>`
    : `<li>${esc(o.ref)}</li>`).join("");
  let strip = "";
  if(ctx){
    const vr = await getVerse(ctx.b, ctx.c, ctx.v);
    const verse = (vr && vr.data && vr.data.live) ? vr.data : null;
    if(verse && verse.words[ctx.pos-1] && verse.words[ctx.pos-1].s === s)
      strip = wordNavStrip(ctx, verse.words);
  }
  return {sample:r.sample, nav:"", html: bannerFor(r.sample) + strip + `<div class="wordpage">
    <div class="wcard">
      <div class="heb-big" lang="he">${esc(w.h)}</div>
      <div class="meta"><span class="tr">${esc(w.t||"")}</span><span class="snum">${esc(s)}</span></div>
      <div class="glossline">${esc(w.g)}</div>
      <div class="grammar">${esc(w.gr)}</div>
      <div class="controls"><label>Your rendering</label>${renderingControls(pseudo, "study", true)}</div>
    </div>
    <div class="panel"><h3>Renderings</h3>
      <div class="rlab">King James</div><div class="rchips">${list(rend.kjv)}</div>
      <div class="rlab">Young's (computed)</div><div class="rchips">${list(rend.ylt)}</div>
    </div>
    <div class="panel"><h3>See also — where this word is also used</h3>
      <ul class="seealso">${occ || `<li class="note">No other occurrences listed.</li>`}</ul></div>
  </div>`};
}
async function viewSearch(q){
  const head = `<div style="text-align:center;padding-top:2rem">
    <h1>Search the verses</h1>
    <form class="searchbar" data-form="search">
      <input type="text" name="q" placeholder="Search by meaning…" value="${q?esc(q):""}">
      <button type="submit">Search</button>
    </form></div>`;
  if(!q) return {sample:false, nav:"", html: head};
  const r = await search(q);
  let body;
  if(r.unavailable) body = errorBlock("Search needs the Bible database, which is unreachable right now.");
  else if(!r.data.length) body = `<p class="note" style="text-align:center;margin-top:1.4rem">${r.sample
    ? `No matches in the offline sample (Genesis 1:1–5 only) for “${esc(q)}”.`
    : `No results for “${esc(q)}”.`}</p>`;
  else body = `<div class="results">` + r.data.map(x=>{
    const ref = x.verse!=null && x.book_id!=null
      ? `<a href="#/interlinear" data-b="${x.book_id}" data-c="${x.chapter||1}" data-v="${x.verse}" data-to="study">${esc(x.ref)}</a>`
      : esc(x.ref);
    const label = x.source==="ylt-computed" ? " · Young's (computed) text"
      : x.source==="sample" ? " · offline sample (King James)" : "";
    return `<div class="result"><div class="ref">${ref}</div>
      <div class="txt">${esc(x.snippet ?? x.text ?? "")}</div>
      <div class="score">${x.score!=null ? `similarity ${Number(x.score).toFixed(2)}` : ""}${label}</div></div>`;
  }).join("") + `</div>`;
  return {sample:r.sample, nav:"", html: head + bannerFor(r.sample) + body};
}

/* ============ ROUTER + EVENTS ============ */
const viewEl = document.getElementById("view");
const textnavEl = document.getElementById("textnav");
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;
  const h = location.hash || "#/";
  viewEl.innerHTML = loadingHtml();
  textnavEl.innerHTML = "";
  let out;
  try{
    if(h.startsWith("#/interlinear")) out = await viewStudy();
    else if(h.startsWith("#/read")) out = await viewRead();
    else if(h.startsWith("#/word/")) out = await viewWordPage(decodeURIComponent(h.slice("#/word/".length)));
    else if(h.startsWith("#/search")){
      let q = lastQuery;
      try{ const p = sessionStorage.getItem("byotPendingQuery");
           if(p){ q = p; sessionStorage.removeItem("byotPendingQuery"); lastQuery = p; } }catch(e){}
      out = await viewSearch(q);
    }
    else out = await viewHome();
  }catch(e){
    out = {nav:"", html: errorBlock("Something went wrong loading this page. Try again.")};
  }
  if(seq!==renderSeq) return;
  viewEl.innerHTML = out.html;
  textnavEl.innerHTML = out.nav || "";
  if(pendingScroll) applyScroll(); else window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>render());
document.addEventListener("click", e=>{
  if(e.target.closest("[data-act='retry']")){ render(); return; }
  const bk = e.target.closest("[data-book]");
  if(bk){ e.preventDefault(); cur.book = +bk.getAttribute("data-book"); cur.ch = 1; cur.v = 1; navTo("#/read"); return; }
  const oc = e.target.closest("[data-to]");
  if(oc){
    e.preventDefault();
    cur.book = +oc.dataset.b || 1; cur.ch = +oc.dataset.c || 1; cur.v = +oc.dataset.v || 1;
    const read = oc.dataset.to==="read";
    navTo(read ? "#/read" : "#/interlinear", read ? "rv"+cur.v : null);
    return;
  }
  if(e.target.closest("[data-act='splashgo']")){
    cur.v = +document.getElementById("splash-verse").value;
    navTo("#/read", "rv"+cur.v);
    return;
  }
  const step = e.target.closest("[data-act='sprev'],[data-act='snext'],[data-act='vprev'],[data-act='vnext']");
  if(step){
    const list = navState.verses;
    if(!list.length) return;
    const i = list.indexOf(cur.v);
    const d = /next/.test(step.getAttribute("data-act")) ? 1 : -1;
    cur.v = list[Math.max(0, Math.min(list.length-1, i+d))];
    if(location.hash.startsWith("#/read")){
      const sel = textnavEl.querySelector("[data-act='vsel']");
      if(sel) sel.value = String(cur.v);
      const el = document.getElementById("rv"+cur.v);
      if(el) el.scrollIntoView({behavior:"smooth"});
    } else render();
  }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.matches("[data-act='tsel']")){
    const s = t.getAttribute("data-s");
    const word = ctlWords.get(s) || {s, kjv:null, ylt:null, g:""};
    if(t.value==="custom") store.set(s, {mode:"custom", text: effective(word, "study") ?? ""});
    else store.set(s, {mode:t.value});
    render().then(()=>{
      if(t.value==="custom"){
        const inp = viewEl.querySelector(`input[data-act='custom'][data-s='${s}']`);
        if(inp){ inp.focus(); inp.select(); }
      }
    });
    return;
  }
  if(t.matches("[data-act='bsel']") || t.matches("[data-act='hbook']")){ cur.book = +t.value; cur.ch = 1; cur.v = 1; render(); return; }
  if(t.matches("[data-act='csel'],[data-act='hch']")){ cur.ch = +t.value; cur.v = 1; render(); return; }
  if(t.matches("[data-act='vsel']")){
    cur.v = +t.value;
    if(location.hash.startsWith("#/read")){
      const el = document.getElementById("rv"+cur.v);
      if(el) el.scrollIntoView({behavior:"smooth"});
    } else render();
  }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.matches("input[data-act='custom']")){
    store.set(t.getAttribute("data-s"), {mode:"custom", text: t.value});
    document.querySelectorAll(".verse-sec").forEach(sec=>{
      const v = verseCache.get(sec.id), el = sec.querySelector(".sentence");
      if(v && el) el.innerHTML = studySentence(v);
    });
  }
});
document.addEventListener("submit", e=>{
  const f = e.target.closest("form[data-form]");
  if(!f) return;
  e.preventDefault();
  const q = f.querySelector("input[name='q']").value;
  lastQuery = q;
  if(f.getAttribute("data-form")==="homesearch"){
    try{ sessionStorage.setItem("byotPendingQuery", q); }catch(err){}
    navTo("#/search");
  } else {
    render();
  }
});
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
render();
</script>
